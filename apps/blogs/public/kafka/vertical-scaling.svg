<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t">
  <title id="t">Vertical scaling: moving from a small place to one bigger place, like a small machine to a bigger machine</title>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
    .flow { animation: flow 1.2s linear infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 3s ease-out infinite both; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-out infinite; }
    .rise { animation: rise 4s ease-out infinite both; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.3); } 25%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes grow { 0% { transform: scaleY(0.2); } 40%, 100% { transform: scaleY(1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 15%, 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#404040">
    <!-- small house -->
    <path d="M110,170 L170,120 L230,170 Z" fill="#e5e5e5" stroke="#a3a3a3" stroke-width="2"/>
    <rect x="125" y="170" width="90" height="70" fill="#f5f5f5" stroke="#a3a3a3" stroke-width="2"/>
    <rect x="160" y="200" width="22" height="40" fill="#d4d4d4"/>
    <text x="170" y="270" text-anchor="middle" font-size="15" font-weight="600">Your house</text>
    <text x="170" y="292" text-anchor="middle" font-size="13" fill="#737373">40 guests · small machine</text>

    <path d="M265,190 L445,190" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <text x="355" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">SCALE UP</text>
    <text x="355" y="215" text-anchor="middle" font-size="12" fill="#737373">make the one place bigger</text>

    <!-- big field / venue -->
    <rect x="470" y="70" width="260" height="170" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g fill="#93c5fd">
      <circle cx="510" cy="110" r="7" class="pop" style="animation-delay:0.06s"/><circle cx="540" cy="110" r="7" class="pop" style="animation-delay:0.12s"/><circle cx="570" cy="110" r="7" class="pop" style="animation-delay:0.18s"/><circle cx="600" cy="110" r="7" class="pop" style="animation-delay:0.24s"/><circle cx="630" cy="110" r="7" class="pop" style="animation-delay:0.30s"/><circle cx="660" cy="110" r="7" class="pop" style="animation-delay:0.36s"/><circle cx="690" cy="110" r="7" class="pop" style="animation-delay:0.42s"/>
      <circle cx="510" cy="145" r="7" class="pop" style="animation-delay:0.48s"/><circle cx="540" cy="145" r="7" class="pop" style="animation-delay:0.54s"/><circle cx="570" cy="145" r="7" class="pop" style="animation-delay:0.60s"/><circle cx="600" cy="145" r="7" class="pop" style="animation-delay:0.66s"/><circle cx="630" cy="145" r="7" class="pop" style="animation-delay:0.72s"/><circle cx="660" cy="145" r="7" class="pop" style="animation-delay:0.78s"/><circle cx="690" cy="145" r="7" class="pop" style="animation-delay:0.84s"/>
      <circle cx="510" cy="180" r="7" class="pop" style="animation-delay:0.90s"/><circle cx="540" cy="180" r="7" class="pop" style="animation-delay:0.96s"/><circle cx="570" cy="180" r="7" class="pop" style="animation-delay:1.02s"/><circle cx="600" cy="180" r="7" class="pop" style="animation-delay:1.08s"/><circle cx="630" cy="180" r="7" class="pop" style="animation-delay:1.14s"/><circle cx="660" cy="180" r="7" class="pop" style="animation-delay:1.20s"/><circle cx="690" cy="180" r="7" class="pop" style="animation-delay:1.26s"/>
      <circle cx="510" cy="215" r="7" class="pop" style="animation-delay:1.32s"/><circle cx="540" cy="215" r="7" class="pop" style="animation-delay:1.38s"/><circle cx="570" cy="215" r="7" class="pop" style="animation-delay:1.44s"/><circle cx="600" cy="215" r="7" class="pop" style="animation-delay:1.50s"/><circle cx="630" cy="215" r="7" class="pop" style="animation-delay:1.56s"/><circle cx="660" cy="215" r="7" class="pop" style="animation-delay:1.62s"/><circle cx="690" cy="215" r="7" class="pop" style="animation-delay:1.68s"/>
    </g>
    <text x="600" y="270" text-anchor="middle" font-size="15" font-weight="600">Your friend's field</text>
    <text x="600" y="292" text-anchor="middle" font-size="13" fill="#737373">150+ guests · one bigger machine</text>
  <circle r="6" fill="#2563eb" opacity="0"><animateMotion dur="1.4s" begin="0s" repeatCount="indefinite" path="M265,190 L440,190"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="0s" repeatCount="indefinite"/></circle>
      </g>
</svg>
