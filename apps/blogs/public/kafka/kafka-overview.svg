<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t">
  <title id="t">Kafka sits between applications and moves real-time data from producers to consumers</title>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
    .flow { animation: flow 1.2s linear infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 3s ease-out infinite both; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-out infinite; }
    .rise { animation: rise 4s ease-out infinite both; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.3); } 25%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes grow { 0% { transform: scaleY(0.2); } 40%, 100% { transform: scaleY(1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 15%, 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="800" height="340" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#404040">
    <text x="110" y="40" text-anchor="middle" font-size="12" fill="#a3a3a3" letter-spacing="2">SENDS DATA</text>
    <g fill="#f5f5f5" stroke="#d4d4d4">
      <rect x="40" y="65" width="140" height="50" rx="10"/>
      <rect x="40" y="145" width="140" height="50" rx="10"/>
      <rect x="40" y="225" width="140" height="50" rx="10"/>
    </g>
    <text x="110" y="95" text-anchor="middle">Web app</text>
    <text x="110" y="175" text-anchor="middle">TCP server</text>
    <text x="110" y="255" text-anchor="middle">Mobile app</text>

    <g stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M180,90 L290,150"/>
      <path d="M180,170 L290,170"/>
      <path d="M180,250 L290,190"/>
      <path d="M510,150 L620,90"/>
      <path d="M510,170 L620,170"/>
      <path d="M510,190 L620,250"/>
    </g>

    <rect x="295" y="60" width="210" height="220" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">Kafka</text>
    <g font-size="13" fill="#1e3a8a">
      <rect x="320" y="120" width="160" height="30" rx="8" fill="#dbeafe"><animate attributeName="fill" values="#dbeafe;#93c5fd;#dbeafe" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect><text x="400" y="140" text-anchor="middle">Collect</text>
      <rect x="320" y="157" width="160" height="30" rx="8" fill="#dbeafe"><animate attributeName="fill" values="#dbeafe;#93c5fd;#dbeafe" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect><text x="400" y="177" text-anchor="middle">Store</text>
      <rect x="320" y="194" width="160" height="30" rx="8" fill="#dbeafe"><animate attributeName="fill" values="#dbeafe;#93c5fd;#dbeafe" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect><text x="400" y="214" text-anchor="middle">Process</text>
      <rect x="320" y="231" width="160" height="30" rx="8" fill="#dbeafe"><animate attributeName="fill" values="#dbeafe;#93c5fd;#dbeafe" dur="2.4s" begin="1.7999999999999998s" repeatCount="indefinite"/></rect><text x="400" y="251" text-anchor="middle">Move</text>
    </g>

    <text x="690" y="40" text-anchor="middle" font-size="12" fill="#a3a3a3" letter-spacing="2">USES DATA</text>
    <g fill="#f5f5f5" stroke="#d4d4d4">
      <rect x="620" y="65" width="140" height="50" rx="10"/>
      <rect x="620" y="145" width="140" height="50" rx="10"/>
      <rect x="620" y="225" width="140" height="50" rx="10"/>
    </g>
    <text x="690" y="95" text-anchor="middle">Database</text>
    <text x="690" y="175" text-anchor="middle">Analytics</text>
    <text x="690" y="255" text-anchor="middle">Alerts</text>

    <text x="400" y="320" text-anchor="middle" font-size="13" fill="#737373">Real-time data flows through Kafka from the systems that produce it to the systems that need it</text>
  <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M180,90 L290,150"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="0.5s" repeatCount="indefinite" path="M180,170 L290,170"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite" path="M180,250 L290,190"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M510,150 L620,90"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite" path="M510,170 L620,170"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#2563eb" opacity="0"><animateMotion dur="1.6s" begin="1.8s" repeatCount="indefinite" path="M510,190 L620,250"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="1.8s" repeatCount="indefinite"/></circle>
      </g>
</svg>
