<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t">
  <title id="t">Many users depend on one primary machine, so when it fails nobody can reach the application</title>
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
    .flow { animation: flow 1.2s linear infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop 3s ease-out infinite both; }
    .glow { animation: glow 2s ease-in-out infinite; }
    .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-out infinite; }
    .rise { animation: rise 4s ease-out infinite both; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes pop { 0% { opacity: 0; transform: scale(0.3); } 25%, 85% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes grow { 0% { transform: scaleY(0.2); } 40%, 100% { transform: scaleY(1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 15%, 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a3a3a3"/></marker>
    <g id="user"><circle cx="0" cy="-12" r="9" fill="#a3a3a3"/><path d="M-16,14 Q-16,-2 0,-2 Q16,-2 16,14 Z" fill="#a3a3a3"/></g>
  </defs>
  <rect width="800" height="320" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#404040">
    <use href="#user" x="90" y="60"/>
    <use href="#user" x="90" y="130"/>
    <use href="#user" x="90" y="200"/>
    <use href="#user" x="160" y="95"/>
    <use href="#user" x="160" y="165"/>
    <use href="#user" x="160" y="235"/>
    <text x="125" y="285" text-anchor="middle" font-size="14">Growing users</text>

    <g stroke="#a3a3a3" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#a)" class="flow">
      <path d="M200,95 L440,140"/>
      <path d="M200,165 L440,160"/>
      <path d="M200,235 L440,180"/>
    </g>

    <rect x="450" y="80" width="150" height="160" rx="14" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="2"/>
    <g fill="#e5e5e5" stroke="#d4d4d4">
      <rect x="470" y="100" width="110" height="28" rx="6"/>
      <rect x="470" y="140" width="110" height="28" rx="6"/>
      <rect x="470" y="180" width="110" height="28" rx="6"/>
    </g>
    <circle cx="565" cy="114" r="4" fill="#a3a3a3"/><circle cx="565" cy="154" r="4" fill="#a3a3a3"/><circle cx="565" cy="194" r="4" fill="#a3a3a3"/>
    <text x="525" y="268" text-anchor="middle" font-size="14">Primary machine</text>

    <g class="pulse"><circle cx="600" cy="80" r="26" fill="#dc2626"/>
    <path d="M588,68 L612,92 M612,68 L588,92" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/></g>

    <g class="glow"><text x="690" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">Single point</text>
    <text x="690" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">of failure</text></g>
    <text x="690" y="198" text-anchor="middle" font-size="12" fill="#737373">One machine down =</text>
    <text x="690" y="214" text-anchor="middle" font-size="12" fill="#737373">no access for anyone</text>
  </g>
</svg>
